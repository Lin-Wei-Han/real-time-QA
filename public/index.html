<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Live Q&A</h1>
    <form id="askForm" class="flex mb-4">
      <input id="questionInput" class="flex-1 border border-gray-300 px-3 py-2 rounded-l transition focus:ring-2 focus:ring-blue-400 focus:border-blue-400" placeholder="Ask a question" />
      <button class="bg-blue-500 text-white px-4 rounded-r transition-colors hover:bg-blue-600">Send</button>
    </form>
    <ul id="questions" class="space-y-2"></ul>
  </div>
  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    const list = document.getElementById('questions');
    const state = [];

    document.getElementById('askForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('questionInput');
      const text = input.value.trim();
      if(text){
        fetch('/ask', { method:'POST', body: JSON.stringify({ text }) });
        input.value='';
      }
    });

    ws.onmessage = event => {
      const msg = JSON.parse(event.data);
      if(msg.type === 'init'){
        state.splice(0, state.length, ...msg.questions);
      } else if(msg.type === 'question'){
        state.push(msg.question);
      } else if(msg.type === 'update'){
        const q = state.find(x => x.id === msg.question.id);
        if(q){ q.votes = msg.question.votes; }
      }
      render();
    };

    function render(){
      list.innerHTML = '';
      state.sort((a,b) => b.votes - a.votes);
      for(const q of state){
        const li = document.createElement('li');
        li.id = 'q-'+q.id;
        li.className = 'bg-white p-4 rounded shadow flex justify-between items-center opacity-0 transition-opacity duration-500 hover:shadow-md';
        li.innerHTML = `<span class="text-lg">${q.text}</span><div class="flex items-center"><span class="votes mr-2">${q.votes}</span><button class="upvote bg-green-500 text-white px-2 rounded transition transform hover:bg-green-600 active:scale-125">▲</button></div>`;
        const up = li.querySelector('.upvote');
        const votes = li.querySelector('.votes');
        up.addEventListener('click', () => {
          fetch('/upvote', {method:'POST', body: JSON.stringify({id: q.id})});
          votes.classList.add('animate-pulse');
          setTimeout(() => votes.classList.remove('animate-pulse'), 300);
        });
        list.appendChild(li);
        requestAnimationFrame(() => li.classList.remove('opacity-0'));
      }
    }
  </script>
</body>
</html>
